<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HUT GEMA NIAS KE-17 | Generasi Muda Nias</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- TAMBAHKAN BARIS INI UNTUK MEMUNCULKAN IKON MUSIK -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">   
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="cover" class="cover-section">
        <div id="cover-bg" class="cover-bg-image"></div>

        <div class="cover-content">
            <!-- 1. DUA LOGO BERDAMPINGAN DI TENGAH -->
         <div class="logo-container fade-up delay-1">
        <!-- Logo Gema Nias (Tangan) dengan efek pendaran cahaya -->
        <img src="assets/images/logo-gema-nias.png" alt="Logo GEMA NIAS" class="logo-img logo-tangan-glow">
        
        <!-- Logo HUT 17 ditambahkan class "logo-17-glow" agar punya animasi cahaya emas -->
        <img src="assets/images/logo-hut-17.png" alt="Logo HUT 17" class="logo-img logo-17-glow">
    </div>

            <p class="subtitle fade-up delay-1">PERAYAAN HUT</p>
            <h1 class="fade-up delay-2">GENERASI MUDA NIAS<br><span>KE-17 TAHUN</span></h1>

            <!-- TEMA ACARA -->
            <div class="theme-box fade-up delay-2">
                <p class="theme-title">"RISE & SHINE"</p>
                <p class="theme-subtitle">Satu Generasi Menuju Generasi Baru</p>
                <div class="pillars">
                    <span>Collaboration</span> &bull; <span>Contribution</span> &bull; <span>Celebration</span>
                </div>
            </div>

            <!-- 2. COUNTDOWN TIMER DI HALAMAN UTAMA COVER -->
            <div class="cover-timer fade-up delay-3">
                <div class="time-box"><span id="days">00</span><p>Hari</p></div>
                <div class="time-box"><span id="hours">00</span><p>Jam</p></div>
                <div class="time-box"><span id="minutes">00</span><p>Menit</p></div>
                <div class="time-box"><span id="seconds">00</span><p>Detik</p></div>
            </div>

            <!-- KOTAK NAMA TAMU -->
            <div class="guest-box fade-up delay-3">
                <p class="guest-text">Kepada Yth. Bapak/Ibu/Saudara/i</p>
                <h2 id="guest-name">Tamu Kehormatan</h2>
            </div>

            <!-- TOMBOL BUKA UNDANGAN -->
            <button id="open-btn" class="btn-primary fade-up delay-4">
                <span>Buka Undangan</span>
            </button>
        </div>
    </div>

 

       <!-- FOOTER / CATATAN KAKI -->
        <footer class="footer-section reveal">
            <h2 class="gold-text footer-title">GEMA NIAS</h2>
            <p class="footer-subtitle">Generasi Muda Nias</p>
            <div class="footer-divider"><span>✦</span></div>
            <p class="footer-copy">© 2026 GEMA NIAS.<br>Nias Berubah</p>
        </footer>
    </div>

    <!-- AUDIO / PLAYLIST 2 LAGU -->
    <audio id="bg-music" preload="auto"></audio>
    
    <button id="music-btn" class="music-toggle" style="display:none;" title="Putar / Jeda Musik">🎵</button>
    <!-- AUDIO & TOMBOL MUSIK DI HALAMAN UTAMA (COVER) -->
    <audio id="bg-music" src="assets/audio/jamrud.mp3" preload="auto" loop></audio>
    <button id="music-btn" class="music-toggle" title="Putar / Jeda Musik">🎵</button>
    <script src="script.js"></script>
</body>
</html>
